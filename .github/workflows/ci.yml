name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web_client/package-lock.json
      - run: go test -race ./... -count=1 -timeout=120s
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: npm ci --prefix web_client
      - run: npm test --prefix web_client
      - run: npm run build --prefix web_client
      - run: mkdir -p ../artifacts && go build -trimpath -o ../artifacts/privrelay-server .
        working-directory: server
      - run: node tools/smoke_web.mjs
      - run: python3 tools/verify.py --help && python3 tools/build_release.py --help
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: android_client
      - run: dart run build_runner build
        working-directory: android_client
      - run: git diff --exit-code -- lib/core/database.g.dart pubspec.lock
        working-directory: android_client
      - run: flutter analyze
        working-directory: android_client
      - run: flutter test
        working-directory: android_client
      - run: flutter build apk --debug --flavor dev
        working-directory: android_client
      - run: bash gradlew :app:testDevDebugUnitTest
        working-directory: android_client/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-dev-debug
          path: android_client/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: privrelay-test-ci
      PRIVRELAY_COMPOSE_TEST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Verify startup and encrypted-volume restart
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          docker compose up -d --wait --wait-timeout 240
          node tools/smoke_compose.mjs
          docker compose exec -T classifier python -m pytest /app/upstream/tests -q -p no:cacheprovider
